name: Publish automatic participation runtime

on:
  schedule:
    - cron: "31 * * * *"
  workflow_dispatch:
    inputs:
      results_pointer:
        description: Immutable results-pointer URL for a reviewed release; blank keeps hourly latest
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: participation-automatic-runtime-writer
  cancel-in-progress: false

jobs:
  await-source:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the source handoff check
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/wait-for-participation-source.py

      - name: Give the current full collection time to publish
        run: |
          python3 scripts/wait-for-participation-source.py | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    needs: await-source
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout website publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout reviewed public results producer
        uses: actions/checkout@v7
        with:
          repository: hanshanley/voter-participation
          ref: ceed5654642d77535ffc9200bf524d4d370cbc43
          path: research-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts
            tests
            pyproject.toml
            data/results-intake/model-seed
            data/results-intake/reviewed-eligibility.json
            data/results-intake/historical-eac-county-facts.json.gz
            data/results-intake/nc-20261113-statewide-and-counties.json
            data/results-intake/oh-20261113-statewide-and-counties.json
            data/results-intake/ga-20261118-statewide-and-counties.json
            data/results-intake/retained-county-canvasses-20261119.json
            data/results-intake/tx-reviewed-turnout-history.json
            data/results-intake/analytical-handoff
            data/results-intake/official-house-precedence
            data/results-intake/native-official-house
            data/results-intake/explicit-reference-names
            data/results-intake/district-boundaries
            data/results-intake/district-splits
            data/results-intake/senate-legacy
            data/results-intake/senate-complete-categories
            data/results-intake/protected-official-house

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research-source/pyproject.toml

      - name: Install the reviewed producer environment
        run: python -m pip install 'requests>=2.31' 'xlrd>=2'

      - name: Verify and atomically publish the data-only runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/research-source
          RESULTS_POINTER: ${{ inputs.results_pointer }}
        run: |
          pointer="$RESULTS_POINTER"
          if [ -z "$pointer" ]; then
            source_commit="$(git ls-remote --exit-code \
              https://github.com/hanshanley/voter-participation.git refs/tags/results-data | cut -f1)"
            [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
            pointer="https://raw.githubusercontent.com/hanshanley/voter-participation/$source_commit/latest.json"
          fi
          python -m scripts.automatic_runtime \
            --results-pointer "$pointer" \
            --repository "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/participation-automatic-runtime" \
            | tee "$RUNNER_TEMP/participation-automatic-runtime-result.json"
          {
            echo '### Automatic participation publication'
            echo '```json'
            cat "$RUNNER_TEMP/participation-automatic-runtime-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain failed runtime evidence only
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: participation-automatic-runtime-failure
          retention-days: 30
          path: |
            ${{ runner.temp }}/participation-automatic-runtime/*.json
            ${{ runner.temp }}/participation-automatic-runtime/*.log
          if-no-files-found: ignore
