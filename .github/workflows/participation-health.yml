name: Monitor participation updates

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: participation-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the reviewed read-only monitor
        uses: actions/checkout@v7
        with:
          repository: hanshanley/voter-participation
          ref: 09d7d56f45163fbc237ee747b4af5fd57389a47d
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/automatic_health.py
      - name: Compare scheduled jobs and active data; maintain one issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automatic_health.py --update-issue
