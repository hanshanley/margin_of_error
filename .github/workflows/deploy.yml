name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Republish after both daily congressional_record refresh windows.
    - cron: "20 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout congressional dashboard
        uses: actions/checkout@v7
        with:
          repository: hanshanley/congressional_record
          path: congressional-record-source

      - name: Stage congressional dashboard
        run: |
          mkdir -p public/congressional_profanity
          cp -R congressional-record-source/site/. public/congressional_profanity/

      - name: Checkout UK evidence project
        uses: actions/checkout@v7
        with:
          repository: hanshanley/uk_decline
          ref: master
          path: uk-decline-source

      - name: Set up the UK page builder
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uk-decline-source/requirements-site.txt

      - name: Build and stage embedded UK pages
        run: |
          pip install -r uk-decline-source/requirements-site.txt
          python uk-decline-source/scripts/build_site.py
          mkdir -p public/uk_decline
          cp -R uk-decline-source/_site/. public/uk_decline/

      - name: Checkout U.S.–China analysis
        uses: actions/checkout@v7
        with:
          repository: hanshanley/china-us-relation-change
          ref: main
          path: china-us-source

      - name: Build and stage collective U.S.–China analysis
        run: |
          pip install -r china-us-source/requirements-exchange.txt
          python china-us-source/scripts/build_exchange_publication.py --output public/china-us-relations

      - name: Checkout verified national platform analysis
        uses: actions/checkout@v7
        with:
          repository: hanshanley/dsa
          ref: 54f671b97af9d21aa52136b64f2dc722487173fd
          path: party-platforms-source
          sparse-checkout: |
            scripts
            data/analysis/national_claims/full
            figures/national_claims/full
            report

      - name: Stage reviewed platform figures and complete downloads
        run: python party-platforms-source/scripts/build_platform_publication.py --output public/party-platforms

      # Political ads are unpublished until explicitly approved for publication.
      - name: Build and upload site
        uses: withastro/action@v6

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
