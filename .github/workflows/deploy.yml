name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Republish after both daily congressional_record refresh windows.
    - cron: "20 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout congressional dashboard
        uses: actions/checkout@v7
        with:
          repository: hanshanley/congressional_record
          path: congressional-record-source

      - name: Stage congressional dashboard
        run: |
          mkdir -p public/professional_profanity
          cp -R congressional-record-source/site/. public/professional_profanity/

      - name: Build and upload site
        uses: withastro/action@v6

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
