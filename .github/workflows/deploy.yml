name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Republish after both daily congressional_record refresh windows.
    - cron: "20 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      uk_manifest_sha256: ${{ steps.uk_publication.outputs.manifest_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reject copied source credentials
        run: python3 scripts/check-public-source-secrets.py

      - name: Test UK publication verification
        run: python3 scripts/test-uk-publication.py

      - name: Checkout congressional dashboard
        uses: actions/checkout@v7
        with:
          repository: hanshanley/congressional_record
          path: congressional-record-source

      - name: Stage congressional dashboard
        run: |
          mkdir -p public/congressional_profanity
          cp -R congressional-record-source/site/. public/congressional_profanity/

      - name: Checkout UK evidence project
        uses: actions/checkout@v7
        with:
          repository: hanshanley/uk_decline
          ref: master
          path: uk-decline-source

      - name: Set up the UK page builder
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uk-decline-source/requirements-site.txt

      - name: Build and stage embedded UK pages
        run: |
          pip install -r uk-decline-source/requirements-site.txt
          python uk-decline-source/scripts/build_site.py
          mkdir -p public/uk_decline
          cp -R uk-decline-source/_site/. public/uk_decline/

      - name: Record UK publication fingerprint
        id: uk_publication
        run: |
          python scripts/uk-publication.py prepare public/uk_decline \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$(git -C uk-decline-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout U.S.–China analysis
        uses: actions/checkout@v7
        with:
          repository: hanshanley/china-us-relation-change
          ref: main
          path: china-us-source

      - name: Build and stage collective U.S.–China analysis
        run: |
          pip install -r china-us-source/requirements-exchange.txt
          python china-us-source/scripts/build_exchange_publication.py --output public/china-us-relations

      - name: Checkout verified national platform analysis
        uses: actions/checkout@v7
        with:
          repository: hanshanley/dsa
          ref: 6b3ac8292dc745eb8ed041eeb79ed1b5ebf2bc1f
          path: party-platforms-source
          sparse-checkout: |
            scripts
            src
            data/analysis/national_claims/full
            data/analysis/dsa_caucuses
            figures/national_claims/full
            docs/reports

      - name: Stage reviewed platform figures and complete downloads
        env:
          PYTHONPATH: party-platforms-source/src
        run: |
          python -m pip install numpy scikit-learn Pillow matplotlib
          python party-platforms-source/scripts/build_platform_publication.py --output public/party-platforms
          python party-platforms-source/scripts/build_caucus_publication.py --output public/party-platforms/caucuses

      # Political ads are unpublished until explicitly approved for publication.
      - name: Checkout verified voter participation analysis
        uses: actions/checkout@v7
        with:
          repository: hanshanley/voter-participation
          ref: 792e3d91609f7ee929c35b5ec15c13710db94be8
          path: voter-participation-source
          sparse-checkout: |
            public

      - name: Build and upload site
        uses: withastro/action@v6
        with:
          build-cmd: node scripts/stage-voter-participation.mjs voter-participation-source && npm run build && node --test scripts/candidate-unpublication.test.mjs && node scripts/prepare-participation-pages.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout publication verifier
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/uk-publication.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy site
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Verify live UK publication
        if: steps.deployment.outcome == 'success'
        id: verify_publication
        continue-on-error: true
        env:
          EXPECTED: ${{ needs.build.outputs.uk_manifest_sha256 }}
        run: |
          python3 scripts/uk-publication.py verify \
            --base https://www.themarginoferror.com/uk_decline/ --expected "$EXPECTED"

      - name: Wait before deployment-only retry
        if: steps.deployment.outcome == 'failure' || steps.verify_publication.outcome == 'failure'
        run: sleep 60

      - name: Retry deployment with the same verified artifact
        if: steps.deployment.outcome == 'failure' || steps.verify_publication.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000

      - name: Verify retried UK publication
        if: steps.deployment_retry.outcome == 'success'
        env:
          EXPECTED: ${{ needs.build.outputs.uk_manifest_sha256 }}
        run: |
          python3 scripts/uk-publication.py verify \
            --base https://www.themarginoferror.com/uk_decline/ --expected "$EXPECTED"
