name: Redeploy verified Pages artifact

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Previously verified github-pages artifact ID
        required: true
        type: string
      source_run_id:
        description: Original successful build run ID
        required: true
        type: string
      source_commit:
        description: Original reviewed main commit
        required: true
        type: string
      artifact_digest:
        description: Original immutable artifact SHA-256 digest
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.recovery.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/redeploy-existing-pages.mjs
            scripts/redeploy-existing-pages.test.mjs
          sparse-checkout-cone-mode: false
      - name: Test pinned-artifact recovery
        run: node --test scripts/redeploy-existing-pages.test.mjs
      - name: Deploy original verified artifact without rebuilding
        id: recovery
        uses: actions/github-script@v8
        env:
          RECOVERY_ARTIFACT_ID: ${{ inputs.artifact_id }}
          RECOVERY_RUN_ID: ${{ inputs.source_run_id }}
          RECOVERY_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RECOVERY_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        with:
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const { recoverPages } = await import(pathToFileURL(process.cwd() + "/scripts/redeploy-existing-pages.mjs").href);
            const expected = {
              artifactId: Number(process.env.RECOVERY_ARTIFACT_ID),
              runId: Number(process.env.RECOVERY_RUN_ID),
              sourceCommit: process.env.RECOVERY_SOURCE_COMMIT,
              artifactDigest: process.env.RECOVERY_ARTIFACT_DIGEST
            };
            try {
              const proof = await recoverPages({ github, core, context, expected });
              fs.writeFileSync("pages-recovery.json", JSON.stringify(proof, null, 2) + "\n");
            } catch (error) {
              fs.writeFileSync("pages-recovery.json", JSON.stringify({
                status: "FAIL_existing_artifact_recovery", ...expected
              }, null, 2) + "\n");
              throw error;
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-recovery-proof
          path: pages-recovery.json
          if-no-files-found: error
