name: Check copied source credentials

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all reachable history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test source and archive checks
        run: python3 scripts/test-public-source-secrets.py
      - name: Reject copied keys in files, archives and history
        run: python3 scripts/check-public-source-secrets.py --history
